<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>⛳ 골프 스코어카드</title>
<style>
:root{--green:#1b6b3c;--green-dark:#124d2b;--green-light:#e6f2ea;--accent:#e8a33d;--bg:#f3f6f4;--card:#ffffff;--text:#1f2b24;--muted:#6b7a72;--danger:#c0392b;--radius:14px;}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);}
.app{max-width:720px;margin:0 auto;padding-bottom:40px;}
.app-header{background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;padding:16px 16px 20px;border-radius:0 0 20px 20px;}
.app-header-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;}
.app-header-top h1{margin:0;font-size:20px;}
.lang-switcher{position:relative;flex:0 0 auto;}
.lang-btn{background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.45);color:#fff;padding:7px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
.lang-dropdown{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,0.22);overflow:hidden;display:none;z-index:30;min-width:150px;}
.lang-dropdown.show{display:block;}
.lang-dropdown button{display:block;width:100%;text-align:left;padding:10px 14px;border:none;background:#fff;color:var(--text);font-size:13px;cursor:pointer;}
.lang-dropdown button:hover{background:var(--green-light);}
.lang-dropdown button.active{color:var(--green-dark);font-weight:700;}
.course-info{display:flex;gap:8px;}
.course-info input{flex:1;padding:10px 12px;border-radius:10px;border:none;font-size:14px;}
.tabbar{display:flex;gap:6px;padding:12px 16px 0;position:sticky;top:0;background:var(--bg);z-index:5;}
.tabbtn{flex:1;padding:10px 6px;border:none;border-radius:10px 10px 0 0;background:#dde8e1;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;}
.tabbtn.active{background:var(--card);color:var(--green-dark);}
main{padding:0 16px 16px;}
.panel{display:none;background:var(--card);border-radius:0 0 var(--radius) var(--radius);padding:16px;}
.panel.active{display:block;}
.card{background:var(--green-light);border-radius:var(--radius);padding:14px;margin-bottom:14px;}
.card label{font-weight:700;font-size:13px;color:var(--green-dark);display:block;margin-bottom:8px;}
.seg{display:flex;gap:8px;}
.seg button{flex:1;padding:10px;border:2px solid var(--green);background:#fff;border-radius:10px;font-weight:700;color:var(--green-dark);cursor:pointer;}
.seg button.active{background:var(--green);color:#fff;}
.team-card{border:1px solid #d8e6dd;border-radius:var(--radius);padding:12px;margin-bottom:12px;background:#fbfdfc;}
.team-card-header{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.team-name-input{flex:1;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid #cfe0d6;font-weight:700;font-size:14px;color:var(--green-dark);}
.btn-remove-team{background:none;border:1px solid var(--danger);color:var(--danger);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;white-space:nowrap;}
.players-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.player-name-input{width:100%;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid #cfe0d6;font-size:13px;}
.btn-primary{width:100%;padding:12px;background:var(--green);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;margin-bottom:10px;}
.btn-danger{width:100%;padding:10px;background:none;color:var(--danger);border:1px solid var(--danger);border-radius:10px;font-size:13px;cursor:pointer;}
.hole-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:10px;}
.hole-chip{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:2px solid var(--green);background:#fff;color:var(--green-dark);font-weight:700;cursor:pointer;}
.hole-chip.active{background:var(--green);color:#fff;}
.hole-info-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.hole-info-top h2{margin:0;font-size:18px;color:var(--green-dark);}
.par-select{display:flex;gap:6px;}
.par-select button{width:34px;height:34px;border-radius:8px;border:2px solid var(--green);background:#fff;font-weight:700;color:var(--green-dark);cursor:pointer;}
.par-select button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
#holeNote{width:100%;min-height:60px;border-radius:10px;border:1px solid #cfe0d6;padding:10px;font-size:13px;resize:vertical;}
.score-row{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid #eef2ef;}
.score-player-label{font-size:14px;font-weight:600;}
.score-player-label small{display:block;color:var(--muted);font-weight:400;font-size:11px;}
.counter{display:flex;align-items:center;gap:10px;}
.counter button{width:34px;height:34px;border-radius:50%;border:none;background:var(--green-light);color:var(--green-dark);font-size:18px;font-weight:700;cursor:pointer;}
.count-display{min-width:34px;text-align:center;font-size:18px;font-weight:700;}
.count-display.plus{color:#1a5fb4;}
.count-display.minus{color:var(--danger);}
.count-display.even{color:var(--text);}
.hole-nav{display:flex;gap:10px;margin-top:14px;}
.hole-nav button{flex:1;padding:12px;border-radius:10px;border:none;background:var(--green);color:#fff;font-weight:700;cursor:pointer;}
#resultSummary{margin-bottom:12px;font-size:13px;color:var(--muted);}
.table-wrap{overflow-x:auto;margin-bottom:14px;}
table{border-collapse:collapse;width:100%;font-size:12px;}
table th,table td{border:1px solid #e3ece6;padding:6px 5px;text-align:center;white-space:nowrap;}
table th{background:var(--green-light);color:var(--green-dark);}
table td.team-row{background:#f1f7f3;font-weight:700;color:var(--green-dark);text-align:left;}
table td.plus{color:#1a5fb4;font-weight:700;}
table td.minus{color:var(--danger);font-weight:700;}
table td.even{color:var(--text);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--green-dark);color:#fff;padding:12px 20px;border-radius:30px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:50;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.modal-overlay{position:fixed;inset:0;background:rgba(18,30,22,0.5);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;border-radius:16px;padding:20px;max-width:340px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,0.25);}
.modal-box h3{margin:0 0 16px;font-size:15px;color:var(--green-dark);text-align:center;font-weight:700;}
.modal-box .btn-primary:last-of-type{margin-bottom:10px;}
#resultCaptureArea{background:#ffffff;}
.anon-row{display:flex;align-items:center;gap:8px;padding:7px 2px;font-size:13px;cursor:pointer;}
.anon-row input[type="checkbox"]{width:16px;height:16px;flex:0 0 auto;accent-color:var(--green);}
.anon-row .anon-team{color:var(--muted);font-size:11px;}
footer.credit{text-align:center;color:var(--muted);font-size:11px;padding:14px;}
  .made-by{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;margin-top:6px;padding:4px 0;}
  .made-by-label{font-size:11px;color:var(--muted);}
  .made-by-icon{width:20px;height:20px;display:block;animation:madeBySpin 6s linear infinite;filter:drop-shadow(0 0 4px rgba(67,56,202,0.5));}
  @keyframes madeBySpin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
  .made-by-text-wrap{position:relative;display:inline-block;}
  .made-by-text{font-weight:700;font-size:13px;letter-spacing:0.03em;background:linear-gradient(90deg,#1f2b24 0%,#4338ca 20%,#1f2b24 40%,#0e7490 60%,#1f2b24 80%,#4338ca 100%);background-size:250% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:madeByShine 4s linear infinite;}
  @keyframes madeByShine{0%{background-position:250% center;}100%{background-position:-250% center;}}
  .made-by-sparkle{position:absolute;color:#4338ca;font-size:0.6rem;animation:madeByTwinkle 1.8s ease-in-out infinite;pointer-events:none;}
  .made-by-sparkle.s1{top:-8px;left:-10px;animation-delay:0s;}
  .made-by-sparkle.s2{top:-4px;right:-12px;font-size:0.5rem;animation-delay:0.6s;}
  .made-by-sparkle.s3{bottom:-8px;left:35%;font-size:0.45rem;animation-delay:1.1s;}
  @keyframes madeByTwinkle{0%,100%{opacity:0;transform:scale(0.4) rotate(0deg);}50%{opacity:1;transform:scale(1.1) rotate(45deg);}}

</style>
</head>

<h1 id="appTitle">⛳ 골프 스코어카드</h1>
<div class="lang-switcher">

<button class="tabbtn" data-tab="result" id="tabResultBtn">📋 결과</button>
</nav>
<main>
<section id="panel-setup" class="panel active">
<div class="card">
<label id="holeCountLabel">홀 수 선택</label>
<div class="seg" id="holeCountSeg">
<button data-holecount="9" id="hole9Btn">9홀</button>
<button data-holecount="18" class="active" id="hole18Btn">18홀</button>
</div>
</div>
<div id="teamsContainer"></div>
<button id="addTeamBtn" class="btn-primary">+ 팀 추가 (최대 20팀)</button>
<button id="resetBtn" class="btn-danger">전체 초기화</button>
</section>
<section id="panel-play" class="panel">
<div class="hole-strip" id="holeStrip"></div>
<div class="card hole-info">
<div class="hole-info-top">
<h2 id="holeTitle">1번 홀</h2>
<div class="par-select" id="parSelect"></div>
</div>
<textarea id="holeNote" placeholder="이 홀의 특징을 적어보세요 (도그렉, 벙커, OB, 그린 경사 등)"></textarea>
</div>
<div id="scoreInputList"></div>
<div class="hole-nav">
<button id="prevHoleBtn">◀ 이전 홀</button>
<button id="nextHoleBtn">다음 홀 ▶</button>
</div>
</section>
<section id="panel-result" class="panel">
<div class="seg" id="sortToggle" style="margin-bottom:12px;">
<button data-sort="team" class="active" id="sortTeamBtn">팀별 보기</button>
<button data-sort="rank" id="sortRankBtn">🏆 순위별 보기</button>
</div>
<div id="resultCaptureArea">
<div id="resultSummary"></div>
<div class="table-wrap">
<table id="resultTable"></table>
</div>
</div>
<div id="anonymizeSection" class="card">
<label id="anonymizeLabel">🙈 SNS 공유 시 이름 가리기</label>
<div id="anonymizeList"></div>
</div>
<button id="copyBtn" class="btn-primary">📋 결과 복사하기 (SNS 공유)</button>
</section>
</main>
<footer class="credit" id="footerText">Field Golf Scorecard · 데이터는 이 기기에만 저장됩니다</footer>

function t(key){
  var dict = I18N[(state && state.lang) || 'ko'];
  var v = dict[key];
  if(typeof v === 'function'){
    var args = Array.prototype.slice.call(arguments, 1);
    return v.apply(null, args);
  }
  return v;
}

/* SCORE_MIN / SCORE_MAX: score is stored RELATIVE TO PAR.
   0 = par, -1 = birdie, -2 = eagle, -3 = albatross, +1 = bogey, etc. */
var SCORE_MIN = -5;
var SCORE_MAX = 20;

function defaultHoles(count){
  var arr = [];
  for(var i=0;i<count;i++) arr.push({par:4, note:''});
  return arr;
}

function defaultPlayers(){
  return [t('playerPlaceholder',1), t('playerPlaceholder',2), t('playerPlaceholder',3), t('playerPlaceholder',4)];
}

function defaultState(){
  return {
    lang:'ko',
    courseName:'',
    playDate:new Date().toISOString().slice(0,10),
    holeCount:18,
    holes:defaultHoles(18),
    teams:[
      {id:1, name:'Team 1', players:['플레이어1','플레이어2','플레이어3','플레이어4'], scores:[[],[],[],[]], entered:[[],[],[],[]], anonymize:[false,false,false,false]}
    ],
    nextTeamId:2,
    currentHole:1,
    resultSortMode:'team'
  };
}

function load(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ state = JSON.parse(raw); } else { state = defaultState(); }
  }catch(e){ state = defaultState(); }
  normalize();
}

function normalize(){
  if(!state.lang) state.lang = 'ko';
  if(state.resultSortMode !== 'team' && state.resultSortMode !== 'rank') state.resultSortMode = 'team';
  if(!state.holeCount) state.holeCount = 18;
  if(!state.holes) state.holes = defaultHoles(state.holeCount);
  while(state.holes.length < state.holeCount) state.holes.push({par:4, note:''});
  state.holes.length = state.holeCount;
  if(!state.teams || !state.teams.length) state.teams = defaultState().teams;
  state.teams.forEach(function(team){
    if(!team.players) team.players = ['플레이어1','플레이어2','플레이어3','플레이어4'];
    if(!team.scores) team.scores = [[],[],[],[]];
    var hadEntered = !!team.entered;
    if(!team.entered) team.entered = [[],[],[],[]];
    if(!team.anonymize) team.anonymize = [false,false,false,false];
    for(var i=0;i<4;i++){
      if(!team.scores[i]) team.scores[i] = [];
      while(team.scores[i].length < state.holeCount) team.scores[i].push(0);
      team.scores[i].length = state.holeCount;
      if(!team.entered[i]) team.entered[i] = [];
      if(!hadEntered){
        for(var h=0; h<state.holeCount; h++){
          if(team.entered[i][h] === undefined) team.entered[i][h] = (team.scores[i][h] || 0) !== 0;
        }
      }
      while(team.entered[i].length < state.holeCount) team.entered[i].push(false);
      team.entered[i].length = state.holeCount;
      if(team.anonymize[i] === undefined) team.anonymize[i] = false;
    }
  });
  if(!state.nextTeamId) state.nextTeamId = state.teams.length+1;
  currentHole = state.currentHole || 1;
  if(currentHole > state.holeCount) currentHole = 1;
}

function save(){
  state.currentHole = currentHole;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ el.classList.remove('show'); }, 2200);
}

/* signed display helper for relative-to-par values: 0 -> "0", +n -> "+n", -n -> "-n" */
function signedLabel(v){
  if(v === 0) return '0';
  return v > 0 ? ('+'+v) : String(v);
}

/* Mask a name for anonymized sharing: keep first character, replace the rest with * */
function maskName(name){
  var str = String(name == null ? '' : name);
  if(str.length <= 1) return str;
  return str.charAt(0) + '*'.repeat(str.length - 1);
}

/* Standard competition ranking (golf-style): equal scores share the same rank,
   and the next distinct score jumps to (position + 1), e.g. 1,2,3,3,3,6,7 */
function assignCompetitionRanks(sortedRows){
  for(var i=0; i<sortedRows.length; i++){
    if(i > 0 && sortedRows[i].grandTotal === sortedRows[i-1].grandTotal){
      sortedRows[i].rank = sortedRows[i-1].rank;
    } else {
      sortedRows[i].rank = i+1;
    }
  }
  var counts = {};
  sortedRows.forEach(function(r){ counts[r.rank] = (counts[r.rank]||0) + 1; });
  sortedRows.forEach(function(r){ r.rankLabel = (counts[r.rank] > 1 ? 'T' : '') + r.rank; });
  return sortedRows;
}

  });
}

function renderScoreList(){
  var rows = '';
  state.teams.forEach(function(team){
    team.players.forEach(function(pname, pi){
      var score = team.scores[pi][currentHole-1] || 0;
      var label = signedLabel(score);
      var cls = score > 0 ? 'plus' : (score < 0 ? 'minus' : 'even');
      rows += '<div class="score-row">' +
        '<span class="score-player-label">' + escapeHtml(pname||t('playerPlaceholder',pi+1)) + '<small>' + escapeHtml(team.name) + '</small></span>' +
        '<div class="counter">' +
        '<button class="minus" data-team-id="'+team.id+'" data-player-idx="'+pi+'">−</button>' +
        '<span class="count-display '+cls+'">' + label + '</span>' +
        '<button class="plus" data-team-id="'+team.id+'" data-player-idx="'+pi+'">+</button>' +
        '</div></div>';
    });
  });
  scoreInputList.innerHTML = rows;
}

scoreInputList.addEventListener('click', function(e){
  var btn = e.target.closest('button.plus, button.minus');
  if(!btn) return;
  var teamId = parseInt(btn.dataset.teamId,10);
  var pi = parseInt(btn.dataset.playerIdx,10);
  var team = state.teams.find(function(t){ return t.id === teamId; });
  if(!team) return;
  var cur = team.scores[pi][currentHole-1] || 0;
  if(btn.classList.contains('plus')){
    cur = Math.min(cur+1, SCORE_MAX);
  } else {
    cur = Math.max(cur-1, SCORE_MIN);
  }
  team.scores[pi][currentHole-1] = cur;
  team.entered[pi][currentHole-1] = true;
  save();
  renderScoreList();
});

var resultSummary = document.getElementById('resultSummary');
var resultTable = document.getElementById('resultTable');

function renderResult(){
  var n = state.holeCount;
  var showSplit = (n === 18);
  var rankMode = (state.resultSortMode === 'rank');

  Array.prototype.forEach.call(sortToggle.children, function(b){
    b.classList.toggle('active', b.dataset.sort === state.resultSortMode);
  });

  resultSummary.innerHTML =
    '<strong>' + escapeHtml(state.courseName || t('courseNameEmpty')) + '</strong> · ' +
    escapeHtml(state.playDate || '') + ' · ' + n + t('holesSuffix');

  var extraCols = showSplit ? 3 : 1; // OUT, IN, TOTAL  vs just TOTAL
  var head = '<tr>';
  if(rankMode) head += '<th>'+escapeHtml(t('rankColumnHeader'))+'</th>';
  head += '<th>'+escapeHtml(t('tableCategory'))+'</th>';
  for(var h=1; h<=n; h++){
    head += '<th>'+h+'<br><small style="font-weight:400;">P'+state.holes[h-1].par+'</small></th>';
    if(showSplit && h === 9){
      head += '<th>'+escapeHtml(t('outLabel'))+'</th>';
    }
  }
  if(showSplit) head += '<th>'+escapeHtml(t('inLabel'))+'</th>';
  head += '<th>'+escapeHtml(t('tableTotal'))+'</th></tr>';

  /* Build one row-data entry per player, independent of grouping/sorting */
  var rows = [];
  state.teams.forEach(function(team){
    team.players.forEach(function(pname, pi){
      var outTotal = 0, inTotal = 0;
      var cells = '';
      for(var h2=0; h2<n; h2++){
        var rel = team.scores[pi][h2] || 0;
        var played = !!team.entered[pi][h2];
        var label = signedLabel(rel);
        var cls = rel > 0 ? 'plus' : (rel < 0 ? 'minus' : 'even');
        cells += '<td class="'+cls+'">' + label + '</td>';
        if(played){
          if(h2 < 9) outTotal += rel; else inTotal += rel;
        }
        if(showSplit && h2 === 8){
          cells += '<td class="'+(outTotal>0?'plus':(outTotal<0?'minus':'even'))+'">'+signedLabel(outTotal)+'</td>';
        }
      }
      var grandTotal = outTotal + inTotal;
      if(showSplit) cells += '<td class="'+(inTotal>0?'plus':(inTotal<0?'minus':'even'))+'">'+signedLabel(inTotal)+'</td>';
      cells += '<td class="'+(grandTotal>0?'plus':(grandTotal<0?'minus':'even'))+'">'+signedLabel(grandTotal)+'</td>';
      rows.push({team:team, pname:pname, pi:pi, cells:cells, grandTotal:grandTotal});
    });
  });

  var body = '';
  if(rankMode){
    var sorted = rows.slice().sort(function(a,b){ return a.grandTotal - b.grandTotal; });
    assignCompetitionRanks(sorted);
    sorted.forEach(function(row){
      var nameCell = '<td class="player-name-cell" data-team-id="'+row.team.id+'" data-player-idx="'+row.pi+'" style="text-align:left;">' +
        escapeHtml(row.pname||t('playerPlaceholder',row.pi+1)) +
        ' <small style="color:var(--muted);">('+escapeHtml(row.team.name)+')</small></td>';
      body += '<tr><td>'+row.rankLabel+'</td>' + nameCell + row.cells + '</tr>';
    });
  } else {
    state.teams.forEach(function(team){
      body += '<tr><td class="team-row" colspan="'+(n+1+extraCols)+'">'+escapeHtml(team.name)+'</td></tr>';
      rows.filter(function(r){ return r.team.id === team.id; }).forEach(function(row){
        body += '<tr><td class="player-name-cell" data-team-id="'+row.team.id+'" data-player-idx="'+row.pi+'" style="text-align:left;">'+escapeHtml(row.pname||t('playerPlaceholder',row.pi+1))+'</td>' + row.cells + '</tr>';
      });
    });
  }

  resultTable.innerHTML = '<thead>'+head+'</thead><tbody>'+body+'</tbody>';
  renderAnonymizeList();
}

var anonymizeListEl = document.getElementById('anonymizeList');

function renderAnonymizeList(){
  var html = '';
  state.teams.forEach(function(team){
    team.players.forEach(function(pname, pi){
      var checked = team.anonymize && team.anonymize[pi];
      html += '<label class="anon-row">' +
        '<input type="checkbox" data-team-id="'+team.id+'" data-player-idx="'+pi+'"'+(checked?' checked':'')+'>' +
        '<span>'+escapeHtml(pname||t('playerPlaceholder',pi+1))+'</span>' +
        '<span class="anon-team">('+escapeHtml(team.name)+')</span>' +
        '</label>';
    });
  });
  anonymizeListEl.innerHTML = html;
}

anonymizeListEl.addEventListener('change', function(e){

  team.anonymize[pi] = cb.checked;

});

function buildResultText(){
  var n = state.holeCount;
  var showSplit = (n === 18);
  var rankMode = (state.resultSortMode === 'rank');
  var lines = [];
  lines.push('⛳ ' + (state.courseName || t('title')));
  lines.push(t('copyDatePrefix') + ' ' + (state.playDate || '') + ' · ' + n + t('holesSuffix'));
  lines.push('');

  var rows = [];
  state.teams.forEach(function(team){
    team.players.forEach(function(pname, pi){
      var outTotal = 0, inTotal = 0;
      var scoresStr = [];
      for(var h=0; h<n; h++){
        var rel = team.scores[pi][h] || 0;
        var played = !!team.entered[pi][h];
        scoresStr.push(signedLabel(rel));
        if(played){
          if(h < 9) outTotal += rel; else inTotal += rel;
        }
      }
      var grandTotal = outTotal + inTotal;
      var totalStr = showSplit
        ? (t('outLabel')+' '+signedLabel(outTotal)+' / '+t('inLabel')+' '+signedLabel(inTotal)+' / '+t('copyTotalLabel')+' '+signedLabel(grandTotal))
        : (t('copyTotalLabel')+' '+signedLabel(grandTotal));
      var isAnon = team.anonymize && team.anonymize[pi];
      var baseName = pname || t('playerPlaceholder', pi+1);
      var displayName = isAnon ? maskName(baseName) : baseName;
      rows.push({team:team, displayName:displayName, scoresStr:scoresStr, totalStr:totalStr, grandTotal:grandTotal});
    });
  });

  if(rankMode){
    var sorted = rows.slice().sort(function(a,b){ return a.grandTotal - b.grandTotal; });
    assignCompetitionRanks(sorted);
    sorted.forEach(function(row){
      lines.push(row.rankLabel+'. '+row.displayName+' ('+row.team.name+'): '+row.scoresStr.join(',')+' ('+row.totalStr+')');
    });
  } else {
    state.teams.forEach(function(team){
      lines.push('[' + team.name + ']');
      rows.filter(function(r){ return r.team.id === team.id; }).forEach(function(row){
        lines.push(row.displayName + ': ' + row.scoresStr.join(',') + ' (' + row.totalStr + ')');
      });
      lines.push('');
    });
  }

  lines.push(t('copyFooter'));
  return lines.join('\n');
}

function copyResultAsText(){
  var text = buildResultText();
  function done(){ toast(t('toastCopied')); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text, done); });
  } else {
    fallbackCopy(text, done);
  }
}

function copyResultAsImage(){
  if(typeof html2canvas !== 'function'){
    toast(t('toastImageFail'));
    return;
  }
  var original = document.getElementById('resultCaptureArea');
  var clone = original.cloneNode(true);
  clone.style.position = 'fixed';
  clone.style.left = '-99999px';
  clone.style.top = '0';
  clone.style.width = 'max-content';
  clone.style.background = '#ffffff';
  clone.style.padding = '16px';
  var wrap = clone.querySelector('.table-wrap');
  if(wrap){ wrap.style.overflow = 'visible'; }

  Array.prototype.forEach.call(clone.querySelectorAll('.player-name-cell'), function(cell){
    var teamId = parseInt(cell.dataset.teamId,10);
    var pi = parseInt(cell.dataset.playerIdx,10);
    var team = state.teams.find(function(tm){ return tm.id === teamId; });
    if(team && team.anonymize && team.anonymize[pi]){
      cell.textContent = maskName(cell.textContent);
    }
  });

  document.body.appendChild(clone);

  html2canvas(clone, {backgroundColor:'#ffffff', scale:2}).then(function(canvas){
    document.body.removeChild(clone);
    canvas.toBlob(function(blob){
      if(!blob){ toast(t('toastImageFail')); return; }
      if(navigator.clipboard && window.ClipboardItem){
        navigator.clipboard.write([new ClipboardItem({'image/png': blob})]).then(function(){
          toast(t('toastImageCopied'));
        }).catch(function(){
          downloadImageBlob(blob);
        });
      } else {
        downloadImageBlob(blob);
      }
    }, 'image/png');
  }).catch(function(){
    if(clone.parentNode) document.body.removeChild(clone);
    toast(t('toastImageFail'));
  });
}

function downloadImageBlob(blob){
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  var fname = (state.courseName || 'scorecard').replace(/[^a-zA-Z0-9가-힣_-]/g,'_');
  a.download = fname + '_' + (state.playDate || '') + '.png';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast(t('toastImageSaved'));
}

function fallbackCopy(text, cb){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); cb(); }catch(e){ toast(t('toastCopyFail')); }
  document.body.removeChild(ta);
}

function renderAll(){
  applyStaticTranslations();
  renderHeader();
  renderSetup();
  renderPlay();
  renderResult();
}

load();
renderAll();
  window.__golfScorecardAPI = {
    getState: function(){ return state; },
    hydrateFromOCR: function(data){
      if(data.courseName){ state.courseName = data.courseName; }
      if(data.roundDate){ state.playDate = data.roundDate; }
      if(data.companions && data.companions.length){
        var t0 = state.teams[0];
        for(var ci=0; ci<data.companions.length && ci<3; ci++){
          t0.players[ci+1] = data.companions[ci];
        }
      }
      if(data.holeScores && data.holeScores.length){
        var t1 = state.teams[0];
        var arr = t1.scores[0] || [];
        var ent = t1.entered[0] || [];
        for(var hi=0; hi<data.holeScores.length && hi<state.holeCount; hi++){
        arr[hi] = data.holeScores[hi];
          ent[hi] = true;
        }
        t1.scores[0] = arr;
        t1.entered[0] = ent;
      }
      save();
      renderAll();
    },
    refresh: function(){ renderAll(); }
  };
})();

function fileToBase64(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve(reader.result.split(",")[1]); };
    reader.onerror = reject;
    reader.readAsDataURL(file);

  var status = sj("sjSaveStatus");
  if(!currentUser){ status.className = "sj-status error"; status.textContent = "로그인이 필요합니다."; return; }
  var state = window.__golfScorecardAPI.getState();
  var parts = sj("sjMyPlayerSelect").value.split("_");
  var ti = Number(parts[0]);
  var pi = Number(parts[1]);
  var team = state.teams[ti];
  var myScores = team.scores[pi] || [];
  var holes = state.holes || [];
  var totalScore = 0;
  var scoreToPar = 0;
  var breakdown = { eagle: 0, birdie: 0, par: 0, bogey: 0, doubleOrWorse: 0 };
  for(var h=0; h<state.holeCount; h++){
    var s = myScores[h];
    if(typeof s !== "number"){ continue; }
      var par = (holes[h] && holes[h].par) || 4;
    totalScore += s;
    var diff = s - par;
    scoreToPar += diff;
    if(diff <= -2){ breakdown.eagle++; }
      else if(diff === -1){ breakdown.birdie++; }
        else if(diff === 0){ breakdown.par++; }
          else if(diff === 1){ breakdown.bogey++; }
            else { breakdown.doubleOrWorse++; }
  }
  var companions = [];
  state.teams.forEach(function(t2, ti2){
    t2.players.forEach(function(name, pi2){
      if(!(ti2 === ti && pi2 === pi)){ companions.push(name); }
    });
  });
  status.className = "sj-status";
  status.textContent = "저장 중...";
  currentUser.getIdToken().then(function(idToken){
    return fetch(COMMIT_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + idToken },
      body: JSON.stringify({
        courseName: state.courseName || "",
        companions: companions,
        roundDate: state.playDate || null,
holeCount: state.holeCount,

        scoreToPar: scoreToPar,
        scoreBreakdown: breakdown,
        inputMethod: lastOcrUsed ? "photo" : "manual",

    setTimeout(function(){ sjClose("sjSaveModal"); }, 1200);

    status.className = "sj-status error";
    status.textContent = "저장 실패: " + (e && e.message ? e.message : e);
  });
});
