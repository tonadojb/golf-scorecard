workflows:
  ios-golf-scorecard:
    name: 골프 스코어카드 iOS 빌드
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Codemagic 앱 설정 화면에서 "App Store Connect" 통합을 연결할 때 붙이는
      # 이름과 정확히 같아야 합니다 (Teams > Integrations > App Store Connect).
      app_store_connect: codemagic
    environment:
      # ⚠ ios_signing 블록을 일부러 뺐습니다. 이 블록이 있으면 Codemagic이 스크립트를
      # 실행하기도 전에 "이미 존재하는" 서명 파일을 자동으로 찾으려고 시도하는데,
      # 계정에 아직 배포용 인증서/프로파일이 하나도 없는 상태(첫 iOS 앱)라 이 사전
      # 탐색 단계에서 즉시 실패하며 빌드 전체가 중단돼버립니다 (그래서 npm install조차
      # 로그에 안 찍혔던 것). 아래 스크립트의 "fetch-signing-files --create" 단계가
      # 인증서/프로파일을 새로 만들고 use-profiles가 그걸 적용하므로 이 블록 없이도
      # 정상 동작합니다.
      vars:
        BUNDLE_ID: "com.skyjang.golfscorecard"
        XCODE_WORKSPACE: "ios-app/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
    scripts:
      - name: npm install (ios-app)
        script: |
          cd ios-app && npm install
      - name: 웹 파일을 www/ 로 복사 + Capacitor 동기화
        script: |
          cd ios-app && npm run sync
      - name: CocoaPods 설치
        script: |
          cd ios-app/ios/App && pod install
      - name: 배포용 인증서 / 프로비저닝 프로파일 자동 생성 (없으면 새로 만들고, 있으면 재사용)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: 코드 서명 프로필 자동 구성
        script: |
          xcode-project use-profiles
      - name: 빌드 번호 자동 증가
        script: |
          cd ios-app/ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: ipa 빌드
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      # 빌드가 끝나면 TestFlight로 자동 업로드합니다. 아직 검토 준비가 안 됐다면
      # submit_to_testflight를 false로 바꿔서 업로드만 안 하고 ipa만 받아볼 수도 있습니다.
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
