<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>⛳ 골프 스코어카드</title>
<style>
:root{--green:#1b6b3c;--green-dark:#124d2b;--green-light:#e6f2ea;--accent:#e8a33d;--bg:#f3f6f4;--card:#ffffff;--text:#1f2b24;--muted:#6b7a72;--danger:#c0392b;--radius:14px;}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);}
.app{max-width:720px;margin:0 auto;padding-bottom:40px;}
.app-header{background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;padding:16px 16px 20px;border-radius:0 0 20px 20px;}
.app-header-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;}
.app-header-top h1{margin:0;font-size:20px;}
.lang-switcher{position:relative;flex:0 0 auto;}
.lang-btn{background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.45);color:#fff;padding:7px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
.lang-dropdown{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,0.22);overflow:hidden;display:none;z-index:30;min-width:150px;}
.lang-dropdown.show{display:block;}
.lang-dropdown button{display:block;width:100%;text-align:left;padding:10px 14px;border:none;background:#fff;color:var(--text);font-size:13px;cursor:pointer;}
.lang-dropdown button:hover{background:var(--green-light);}
.lang-dropdown button.active{color:var(--green-dark);font-weight:700;}
.course-info{display:flex;gap:8px;}
.course-info input{flex:1;padding:10px 12px;border-radius:10px;border:none;font-size:14px;}
.tabbar{display:flex;gap:6px;padding:12px 16px 0;position:sticky;top:0;background:var(--bg);z-index:5;}
.tabbtn{flex:1;padding:10px 6px;border:none;border-radius:10px 10px 0 0;background:#dde8e1;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;}
.tabbtn.active{background:var(--card);color:var(--green-dark);}
main{padding:0 16px 16px;}
.panel{display:none;background:var(--card);border-radius:0 0 var(--radius) var(--radius);padding:16px;}
.panel.active{display:block;}
.card{background:var(--green-light);border-radius:var(--radius);padding:14px;margin-bottom:14px;}
.card label{font-weight:700;font-size:13px;color:var(--green-dark);display:block;margin-bottom:8px;}
.seg{display:flex;gap:8px;}
.seg button{flex:1;padding:10px;border:2px solid var(--green);background:#fff;border-radius:10px;font-weight:700;color:var(--green-dark);cursor:pointer;}
.seg button.active{background:var(--green);color:#fff;}
.team-card{border:1px solid #d8e6dd;border-radius:var(--radius);padding:12px;margin-bottom:12px;background:#fbfdfc;}
.team-card-header{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.team-name-input{flex:1;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid #cfe0d6;font-weight:700;font-size:14px;color:var(--green-dark);}
.btn-remove-team{background:none;border:1px solid var(--danger);color:var(--danger);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;white-space:nowrap;}
.players-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.player-name-input{width:100%;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid #cfe0d6;font-size:13px;}
.btn-primary{width:100%;padding:12px;background:var(--green);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;margin-bottom:10px;}
.btn-danger{width:100%;padding:10px;background:none;color:var(--danger);border:1px solid var(--danger);border-radius:10px;font-size:13px;cursor:pointer;}
.hole-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:10px;}
.hole-chip{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:2px solid var(--green);background:#fff;color:var(--green-dark);font-weight:700;cursor:pointer;}
.hole-chip.active{background:var(--green);color:#fff;}
.hole-info-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.hole-info-top h2{margin:0;font-size:18px;color:var(--green-dark);}
.par-select{display:flex;gap:6px;}
.par-select button{width:34px;height:34px;border-radius:8px;border:2px solid var(--green);background:#fff;font-weight:700;color:var(--green-dark);cursor:pointer;}
.par-select button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
#holeNote{width:100%;min-height:60px;border-radius:10px;border:1px solid #cfe0d6;padding:10px;font-size:13px;resize:vertical;}
.score-row{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid #eef2ef;}
.score-player-label{font-size:14px;font-weight:600;}
.score-player-label small{display:block;color:var(--muted);font-weight:400;font-size:11px;}
.counter{display:flex;align-items:center;gap:10px;}
.counter button{width:34px;height:34px;border-radius:50%;border:none;background:var(--green-light);color:var(--green-dark);font-size:18px;font-weight:700;cursor:pointer;}
.count-display{min-width:34px;text-align:center;font-size:18px;font-weight:700;}
.count-display.plus{color:#1a5fb4;}
.count-display.minus{color:var(--danger);}
.count-display.even{color:var(--text);}
.hole-nav{display:flex;gap:10px;margin-top:14px;}
.hole-nav button{flex:1;padding:12px;border-radius:10px;border:none;background:var(--green);color:#fff;font-weight:700;cursor:pointer;}
#resultSummary{margin-bottom:12px;font-size:13px;color:var(--muted);}
.table-wrap{overflow-x:auto;margin-bottom:14px;}
table{border-collapse:collapse;width:100%;font-size:12px;}
table th,table td{border:1px solid #e3ece6;padding:6px 5px;text-align:center;white-space:nowrap;}
table th{background:var(--green-light);color:var(--green-dark);}
table td.team-row{background:#f1f7f3;font-weight:700;color:var(--green-dark);text-align:left;}
table td.plus{color:#1a5fb4;font-weight:700;}
table td.minus{color:var(--danger);font-weight:700;}
table td.even{color:var(--text);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--green-dark);color:#fff;padding:12px 20px;border-radius:30px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:50;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.modal-overlay{position:fixed;inset:0;background:rgba(18,30,22,0.5);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;border-radius:16px;padding:20px;max-width:340px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,0.25);}
.modal-box h3{margin:0 0 16px;font-size:15px;color:var(--green-dark);text-align:center;font-weight:700;}
.modal-box .btn-primary:last-of-type{margin-bottom:10px;}
#resultCaptureArea{background:#ffffff;}
.anon-row{display:flex;align-items:center;gap:8px;padding:7px 2px;font-size:13px;cursor:pointer;}
.anon-row input[type="checkbox"]{width:16px;height:16px;flex:0 0 auto;accent-color:var(--green);}
.anon-row .anon-team{color:var(--muted);font-size:11px;}
footer.credit{text-align:center;color:var(--muted);font-size:11px;padding:14px;}
.made-by{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;margin-top:6px;padding:4px 0;}
.made-by-label{font-size:11px;color:var(--muted);}
.made-by-icon{width:20px;height:20px;display:block;animation:madeBySpin 6s linear infinite;filter:drop-shadow(0 0 4px rgba(67,56,202,0.5));}
@keyframes madeBySpin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
.made-by-text-wrap{position:relative;display:inline-block;}
.made-by-text{font-weight:700;font-size:13px;letter-spacing:0.03em;background:linear-gradient(90deg,#1f2b24 0%,#4338ca 20%,#1f2b24 40%,#0e7490 60%,#1f2b24 80%,#4338ca 100%);background-size:250% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:madeByShine 4s linear infinite;}
@keyframes madeByShine{0%{background-position:250% center;}100%{background-position:-250% center;}}
.made-by-sparkle{position:absolute;color:#4338ca;font-size:0.6rem;animation:madeByTwinkle 1.8s ease-in-out infinite;pointer-events:none;}
.made-by-sparkle.s1{top:-8px;left:-10px;animation-delay:0s;}
.made-by-sparkle.s2{top:-4px;right:-12px;font-size:0.5rem;animation-delay:0.6s;}
.made-by-sparkle.s3{bottom:-8px;left:35%;font-size:0.45rem;animation-delay:1.1s;}
@keyframes madeByTwinkle{0%,100%{opacity:0;transform:scale(0.4) rotate(0deg);}50%{opacity:1;transform:scale(1.1) rotate(45deg);}}
.sj-fab-wrap{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:10px;z-index:9999;}
.sj-fab{width:52px;height:52px;border-radius:50%;border:none;background:#1b6b3c;color:#fff;font-size:20px;box-shadow:0 4px 10px rgba(0,0,0,.25);cursor:pointer;}
.sj-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:10000;padding:16px;}
.sj-modal-overlay.open{display:flex;}
.sj-modal{background:#fff;border-radius:14px;padding:20px;max-width:360px;width:100%;max-height:85vh;overflow:auto;}
.sj-modal h3{margin:0 0 12px;font-size:17px;color:#1f2b24;}
.sj-modal label{display:block;font-size:13px;margin:10px 0 4px;color:#444;}
.sj-modal input,.sj-modal select{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:14px;box-sizing:border-box;}
.sj-modal button.sj-primary{margin-top:14px;width:100%;padding:11px;border:none;border-radius:8px;background:#1b6b3c;color:#fff;font-size:15px;cursor:pointer;}
.sj-modal button.sj-secondary{margin-top:8px;width:100%;padding:9px;border:none;border-radius:8px;background:#eee;color:#333;font-size:14px;cursor:pointer;}
.sj-modal .sj-close{float:right;background:none;border:none;font-size:18px;cursor:pointer;color:#888;}
.sj-status{font-size:13px;color:#1b6b3c;margin-top:8px;min-height:16px;}
.sj-status.error{color:#c0392b;}
.sj-social-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-top:10px;}
.sj-social-btn.google{background:#fff;color:#333;border:1px solid #ddd;}
.sj-social-btn.kakao{background:#FEE500;color:#191600;}
.sj-social-btn.naver{background:#03C75A;color:#fff;}
</style>
</head>
<body>
<div class="app">
<header class="app-header">
<div class="app-header-top">
<h1 id="appTitle">⛳ 골프 스코어카드</h1>
<div class="lang-switcher">
<button id="langBtn" class="lang-btn">🌐 Language</button>
<div id="langDropdown" class="lang-dropdown">
<button data-lang="ko">한국어 (Korean)</button>
<button data-lang="en">English</button>
<button data-lang="ja">日本語 (Japanese)</button>
<button data-lang="zh">中文 (Chinese)</button>
</div>
</div>
</div>
<div class="course-info">
<input id="courseName" placeholder="코스명을 입력하세요">
<input id="playDate" type="date">
</div>
</header>
<nav class="tabbar">
<button class="tabbtn active" data-tab="setup" id="tabSetupBtn">👥 팀 설정</button>
<button class="tabbtn" data-tab="play" id="tabPlayBtn">🏌️ 스코어 입력</button>
<button class="tabbtn" data-tab="result" id="tabResultBtn">📋 결과</button>
</nav>
<main>
<section id="panel-setup" class="panel active">
<div class="card">
<label id="holeCountLabel">홀 수 선택</label>
<div class="seg" id="holeCountSeg">
<button data-holecount="9" id="hole9Btn">9홀</button>
<button data-holecount="18" class="active" id="hole18Btn">18홀</button>
</div>
</div>
<div id="teamsContainer"></div>
<button id="addTeamBtn" class="btn-primary">+ 팀 추가 (최대 20팀)</button>
<button id="resetBtn" class="btn-danger">전체 초기화</button>
</section>
<section id="panel-play" class="panel">
<div class="hole-strip" id="holeStrip"></div>
<div class="card hole-info">
<div class="hole-info-top">
<h2 id="holeTitle">1번 홀</h2>
<div class="par-select" id="parSelect"></div>
</div>
<textarea id="holeNote" placeholder="이 홀의 특징을 적어보세요 (도그렉, 벙커, OB, 그린 경사 등)"></textarea>
</div>
<div id="scoreInputList"></div>
<div class="hole-nav">
<button id="prevHoleBtn">◀ 이전 홀</button>
<button id="nextHoleBtn">다음 홀 ▶</button>
</div>
</section>
<section id="panel-result" class="panel">
<div class="seg" id="sortToggle" style="margin-bottom:12px;">
<button data-sort="team" class="active" id="sortTeamBtn">팀별 보기</button>
<button data-sort="rank" id="sortRankBtn">🏆 순위별 보기</button>
</div>
<div id="resultCaptureArea">
<div id="resultSummary"></div>
<div class="table-wrap">
<table id="resultTable"></table>
</div>
</div>
<div id="anonymizeSection" class="card">
<label id="anonymizeLabel">🙈 SNS 공유 시 이름 가리기</label>
<div id="anonymizeList"></div>
</div>
<button id="copyBtn" class="btn-primary">📋 결과 복사하기 (SNS 공유)</button>
</section>
</main>
<footer class="credit" id="footerText">Field Golf Scorecard · 데이터는 이 기기에만 저장됩니다</footer>
<a class="made-by" href="https://skyjang.com/" target="_blank" rel="noopener noreferrer">
<span class="made-by-label">Made by</span>
<svg class="made-by-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="madeByGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#312e81"/>
<stop offset="50%" stop-color="#4338ca"/>
<stop offset="100%" stop-color="#0e7490"/>
</linearGradient>
<radialGradient id="madeByGlow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
<stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</radialGradient>
</defs>
<circle cx="50" cy="50" r="46" fill="url(#madeByGrad)" opacity="0.95"/>
<circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>

<line x1="74" y1="28" x2="56" y2="32"/>

<circle cx="36" cy="36" r="2.6" fill="#ffffff"/>

<path d="M0 -6 L1.4 -1.4 L6 0 L1.4 1.4 L0 6 L-1.4 1.4 L-6 0 L-1.4 -1.4 Z" fill="#fef9c3"/>

</svg>
<span class="made-by-text-wrap">
<span class="made-by-text">SkyJANG Labs</span>
<span class="made-by-sparkle s1">✦</span>
<span class="made-by-sparkle s2">✦</span>
<span class="made-by-sparkle s3">✦</span>
</span>
</a>
</div>
<div id="toast" class="toast"></div>
<div id="shareModalOverlay" class="modal-overlay">
<div class="modal-box">
<h3 id="shareModalTitle">공유 방식을 선택하세요</h3>
<button id="shareAsTextBtn" class="btn-primary">📝 텍스트로 복사</button>
<button id="shareAsImageBtn" class="btn-primary">🖼️ 이미지로 복사</button>
<button id="shareCancelBtn" class="btn-danger">취소</button>
</div>
</div>
